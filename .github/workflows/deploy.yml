name: Deploy

# Runs after CI passes on a push to main (ADR-0002). Can also be run by hand from main
# (Actions -> Deploy -> Run workflow) for the first deploy or a redeploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; never cancel a deploy halfway through.
  group: deploy-production
  cancel-in-progress: false

jobs:
  not-configured:
    # Until the server exists (docs/deploy.md), say so instead of failing.
    if: vars.RELAY_DOMAIN == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Deploy skipped. Set the RELAY_DOMAIN variable and DEPLOY_* secrets (docs/deploy.md)."

  deploy:
    if: >-
      vars.RELAY_DOMAIN != '' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.RELAY_DOMAIN }}
    permissions:
      contents: read
      packages: write
    env:
      # workflow_run: the commit CI tested. workflow_dispatch: the tip of main.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Work out the image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry names must be lowercase
          echo "IMAGE=ghcr.io/${owner}/relay-api:${SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: refuse to deploy to a server we don't recognise.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host relay
            HostName ${DEPLOY_HOST}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the stack definition
        run: scp infra/prod/compose.yaml infra/prod/Caddyfile relay:/opt/relay/

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Token goes over stdin so it never appears in a process list on the server.
          # GHCR_USER and IMAGE expand here on purpose; they are a login name and a registry/SHA tag.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh relay "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # shellcheck disable=SC2029
          ssh relay "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/relay
          printf 'RELAY_API_IMAGE=%s\n' "$IMAGE" > release.env
          compose="docker compose --env-file .env --env-file release.env"
          $compose pull
          $compose up -d --remove-orphans
          docker logout ghcr.io
          # Remove images no container uses (older releases). Rollback re-pulls from GHCR.
          docker image prune -af
          $compose ps
          REMOTE

      - name: Check the live health endpoint
        run: |
          for i in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://${RELAY_DOMAIN}/health" || true)
            if [ "$code" = "200" ]; then
              echo "https://${RELAY_DOMAIN}/health is 200"
              exit 0
            fi
            echo "attempt $i: got $code"
            sleep 5
          done
          echo "Deploy finished but /health never returned 200"
          ssh relay "cd /opt/relay && docker compose --env-file .env --env-file release.env logs --tail 100 api caddy"
          exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
