services:
  postgres:
    image: postgres:18.6

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?"set POSTGRES_USER in infra/.env (copy .env.example)"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?"set POSTGRES_PASSWORD in infra/.env (copy .env.example)"}
      POSTGRES_DB: ${POSTGRES_DB:?"set POSTGRES_DB in infra/.env (copy .env.example)"}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
